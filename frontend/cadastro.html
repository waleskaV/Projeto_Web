<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastro</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <header>

        <div class="header-content">

            <h1>Sistema de Saúde</h1>

            <nav>
                <a href="index.html">
                    Login
                </a>
            </nav>

        </div>

    </header>

    <div class="login-container">

        <div class="card">

            <h2>Criar conta</h2>

            <form id="formCadastro">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    required
                >

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                >

                <label for="documento">
                    CPF / Documento
                </label>

                <input
                    type="text"
                    id="documento"
                >

                <label for="telefone">
                    Telefone
                </label>

                <input
                    type="text"
                    id="telefone"
                >

                <button type="submit">
                    Cadastrar
                </button>

            </form>

            <div
                id="mensagem"
                class="mensagem"
            ></div>

            <p>

                Já possui conta?

                <a
                    href="index.html"
                    class="link"
                >
                    Fazer login
                </a>

            </p>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/cadastro.js"></script>

</body>

</html>
