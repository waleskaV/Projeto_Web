<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Cadastrar Médico</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <header>

        <div class="header-content">

            <h1>Sistema de Saúde</h1>

            <nav>

                <a href="dashboard.html">
                    Início
                </a>

                <a href="usuarios.html">
                    Usuários
                </a>

                <a href="cadastrar-medico.html">
                    Cadastrar Médico
                </a>

                <a
                    href="#"
                    onclick="logout()"
                >
                    Sair
                </a>

            </nav>

        </div>

    </header>


    <main class="container">

        <div class="card">

            <h2>Cadastrar Médico</h2>

            <form id="formMedico">

                <label for="nome">
                    Nome
                </label>

                <input
                    type="text"
                    id="nome"
                    required
                >


                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >


                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    required
                >


                <label for="crm">
                    CRM
                </label>

                <input
                    type="text"
                    id="crm"
                    required
                >


                <label for="especialidade">
                    Especialidade
                </label>

                <input
                    type="text"
                    id="especialidade"
                    placeholder="Ex.: Cardiologia"
                    required
                >


                <label for="descricao">
                    Descrição da especialidade
                </label>

                <textarea
                    id="descricao"
                    placeholder="Ex.: Atendimento cardiológico"
                ></textarea>


                <button type="submit">
                    Cadastrar médico
                </button>

            </form>


            <div
                id="mensagem"
                class="mensagem"
            ></div>

        </div>

    </main>


    <script src="js/api.js"></script>
    <script src="js/cadastrar-medico.js"></script>

</body>

</html>
