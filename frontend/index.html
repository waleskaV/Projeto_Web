<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Sistema de Saúde</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

    <div class="login-container">

        <div class="card">

            <h2 class="text-center">
                Sistema de Saúde
            </h2>

            <p class="text-center">
                Acesse sua conta
            </p>

            <form id="formLogin">

                <label for="email">
                    E-mail
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Digite seu e-mail"
                    required
                >

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    placeholder="Digite sua senha"
                    required
                >

                <button
                    type="submit"
                    style="width: 100%;"
                >
                    Entrar
                </button>

            </form>

            <div
                id="mensagem"
                class="mensagem"
            ></div>

            <p class="text-center">

                Não possui uma conta?

                <a
                    href="cadastro.html"
                    class="link"
                >
                    Cadastre-se
                </a>

            </p>

        </div>

    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>

</body>

</html>
